<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime · Myani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/api.js" defer></script>
  <script src="js/anime.js" defer></script>
</head>
<body>
  <input type="checkbox" id="theme" hidden>

  <header class="topbar">
    <a class="logo" href="index.html">myani<span class="logo__dot">.</span></a>
    <nav class="topbar__nav">
      <a class="topbar__link" href="index.html">Explorar</a>
      <a class="topbar__link" href="profile.html">Meu perfil</a>
    </nav>
    <form class="topbar__search" role="search" action="index.html">
      <input type="hidden" name="type" value="anime">
      <input class="topbar__search-input" type="search" name="q" placeholder="Buscar anime..." aria-label="Buscar anime">
    </form>
    <label class="theme-toggle" for="theme" aria-label="Alternar tema">
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </label>
  </header>

  <main class="container">
    <div id="anime-status"></div>

    <section class="hero" id="hero" hidden></section>

    <section id="episodes-section" hidden>
      <div class="section-head">
        <h2 class="section-head__title">Episódios</h2>
        <span class="section-head__summary" id="episodes-summary"></span>
      </div>
      <div id="episodes-list"></div>
      <nav class="pagination" aria-label="Paginação dos episódios" id="episodes-pagination"></nav>
    </section>
  </main>
</body>
</html>
