<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <input type="checkbox" id="theme" hidden>

  <header class="topbar">
    <a class="logo" href="index.html">myani<span class="logo__dot">.</span></a>
    <nav class="topbar__nav">
      <a class="topbar__link is-active" href="index.html">Minha lista</a>
      <a class="topbar__link" href="#">Explorar</a>
    </nav>
    <form class="topbar__search" role="search">
      <input class="topbar__search-input" type="search" placeholder="Buscar anime..." aria-label="Buscar anime">
    </form>
    <label class="theme-toggle" for="theme" aria-label="Alternar tema">
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </label>
    <a class="avatar topbar__avatar" href="profile.html" aria-label="Perfil">L</a>
  </header>

  <main class="container">
    <section class="hero" style="--banner: url(https://s4.anilist.co/file/anilistcdn/media/anime/banner/154587-ivXNJ23SM1xB.jpg)">
      <img class="hero__cover" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx154587-qQTzQnEJJ3oB.jpg" alt="Capa de Frieren">
      <div class="hero__body">
        <span class="hero__eyebrow">Continue de onde parou</span>
        <h1 class="hero__title">Frieren</h1>
        <p class="hero__meta">2023 · 28 episódios · Nota 9,1</p>
        <div class="progress progress--large hero__progress"><span class="progress__bar" style="width: 64%"></span></div>
        <p class="hero__episode">Episódio <strong class="hero__episode-number">18</strong> de 28</p>
        <button class="btn hero__action">Marcar episódio 19</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2 class="section-head__title">Minha lista</h2>
        <div class="tabs">
          <button class="tabs__item is-active">Assistindo</button>
          <button class="tabs__item">Quero assistir</button>
          <button class="tabs__item">Concluídos</button>
        </div>
      </div>

      <div class="card-grid">
        <article class="card">
          <div class="card__cover">
            <img class="card__image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx171018-60q1B6GK2Ghb.jpg" alt="Capa de Dandadan">
            <div class="progress card__progress"><span class="progress__bar" style="width: 58%"></span></div>
          </div>
          <h3 class="card__title">Dandadan</h3>
          <p class="card__info">Ep. 7 de 12</p>
        </article>
        <article class="card">
          <div class="card__cover">
            <img class="card__image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx101348-2fhDFPCuMNiz.jpg" alt="Capa de Vinland Saga">
            <div class="progress card__progress"><span class="progress__bar" style="width: 83%"></span></div>
          </div>
          <h3 class="card__title">Vinland Saga</h3>
          <p class="card__info">Ep. 20 de 24</p>
        </article>
        <article class="card">
          <div class="card__cover">
            <img class="card__image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx151807-it355ZgzquUd.png" alt="Capa de Solo Leveling">
            <div class="progress card__progress"><span class="progress__bar" style="width: 75%"></span></div>
          </div>
          <h3 class="card__title">Solo Leveling</h3>
          <p class="card__info">Ep. 9 de 12</p>
        </article>
        <article class="card">
          <div class="card__cover">
            <img class="card__image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx127230-DdP4vAdssLoz.png" alt="Capa de Chainsaw Man">
            <div class="progress card__progress"><span class="progress__bar" style="width: 42%"></span></div>
          </div>
          <h3 class="card__title">Chainsaw Man</h3>
          <p class="card__info">Ep. 5 de 12</p>
        </article>
        <article class="card">
          <div class="card__cover">
            <img class="card__image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx153288-25FBfFJzEQ5O.jpg" alt="Capa de Kaiju No. 8">
            <div class="progress card__progress"><span class="progress__bar" style="width: 25%"></span></div>
          </div>
          <h3 class="card__title">Kaiju No. 8</h3>
          <p class="card__info">Ep. 3 de 12</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
