<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar · Myani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/api.js" defer></script>
  <script src="js/search.js" defer></script>
</head>
<body>
  <input type="checkbox" id="theme" hidden>

  <header class="topbar">
    <a class="logo" href="index.html">myani<span class="logo__dot">.</span></a>
    <nav class="topbar__nav">
      <a class="topbar__link is-active" href="index.html">Explorar</a>
      <a class="topbar__link" href="profile.html">Meu perfil</a>
    </nav>
    <label class="theme-toggle topbar__theme" for="theme" aria-label="Alternar tema">
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </label>
  </header>

  <main class="container">
    <section class="search-panel">
      <div>
        <h1 class="search-panel__title">Explorar</h1>
        <p class="search-panel__subtitle">Encontre animes do catálogo ou perfis de outras pessoas.</p>
      </div>

      <div class="tabs search-panel__tabs" role="tablist">
        <button class="tabs__item is-active" type="button" data-type="anime">Animes</button>
        <button class="tabs__item" type="button" data-type="user">Perfis</button>
      </div>

      <form class="search-panel__form" role="search" id="search-form">
        <input class="field__input search-panel__input" type="search" placeholder="Buscar anime pelo título..." aria-label="Termo da busca" id="search-input">
        <button class="btn" type="submit">Buscar</button>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2 class="section-head__title">Resultados</h2>
        <span class="section-head__summary" id="summary"></span>
      </div>
      <div id="results"></div>
      <nav class="pagination" aria-label="Paginação" id="pagination"></nav>
    </section>
  </main>
</body>
</html>
