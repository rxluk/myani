<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta · Myani</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <input type="checkbox" id="theme" hidden>

  <div class="auth">
    <aside class="auth__art">
      <div class="auth__collage">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx21-ELSYx3yMPcKM.jpg" alt="">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx20-dE6UHbFFg1A5.jpg" alt="">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx269-d2GmRkJbMopq.png" alt="">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx33-PSwfE5B0gejI.jpg" alt="">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx11061-y5gsT1hoHuHw.png" alt="">
        <img class="auth__collage-image" src="https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx5231-SuMNWJQQK8jl.png" alt="">
      </div>
      <p class="auth__tagline">Seus animes, seu progresso, tudo em um só lugar.</p>
    </aside>

    <main class="auth__main">
      <label class="theme-toggle auth__theme-toggle" for="theme" aria-label="Alternar tema">
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </label>

      <form class="auth__form">
        <a class="logo auth__logo" href="index.html">myani<span class="logo__dot">.</span></a>
        <h1 class="auth__title">Criar conta</h1>
        <p class="auth__subtitle">Comece a montar sua lista.</p>

        <div class="field-row">
          <label class="field">
            Nome
            <input class="field__input" type="text" placeholder="Seu nome" required>
          </label>
          <label class="field">
            Usuário
            <input class="field__input" type="text" placeholder="@usuario" required>
          </label>
        </div>
        <label class="field">
          E-mail
          <input class="field__input" type="email" placeholder="seu@email.com" required>
        </label>
        <label class="field">
          Senha
          <input class="field__input" type="password" placeholder="Mínimo de 8 caracteres" minlength="8" required>
        </label>

        <button class="btn auth__submit" type="submit">Criar conta</button>
        <p class="auth__footer">Já tem conta? <a class="auth__link" href="login.html">Entrar</a></p>
      </form>
    </main>
  </div>
</body>
</html>
