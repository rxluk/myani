services:
  db:
    image: postgres:18
    container_name: database
    environment:
      POSTGRES_USER: guest
      POSTGRES_PASSWORD: guest
      POSTGRES_DB: myani_db
      
    ports: 
      - "5432:5432"

    volumes:
        - postgres_data:/var/lib/postgresql
        - ./database:/docker-entrypoint-initdb.d 

volumes:
  postgres_data: